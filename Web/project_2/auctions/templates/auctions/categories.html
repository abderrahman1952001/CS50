{% extends "auctions/layout.html" %}    

{% block body %}

    <h2>Categories:</h2>
    {% if categories %}
        <ul>
        {% for category in categories %}
            <li><a href="{% url 'category_listings' category.name %}">{{ category.name }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <h2>No categories Listed.</h2>
    {% endif %}

{% endblock %}
