{% extends "encyclopedia/layout.html" %}

{% block title %}Create New Page{% endblock %}

{% block body %}

{% if error %}
    <br>
    <h2 style="color: red; text-align: center;">{{ error }}</h2>
    <br>
    <br>
{% endif %}

<h2>Create a New Page</h2>


<form action="{% url 'encyclopedia:new' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Create Page</button>
</form>

{% endblock %}
