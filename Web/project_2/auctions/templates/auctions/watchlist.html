{% extends "auctions/layout.html" %}    

{% block body %}

    <h2>Watchlist:</h2>
    {% if watchlist %}
        <ul>
        {% for listing in watchlist %}
            <li><a href="{% url 'view_listing' listing.id %}">{{ listing.title }}</a></li>
        {% endfor %}
        </ul>
    {% else %}
        <h2>No items in your watchlist.</h2>
    {% endif %}

{% endblock %}
